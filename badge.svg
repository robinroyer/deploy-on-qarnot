<svg xmlns="http://www.w3.org/2000/svg" width="200" height="36" viewBox="0 0 200 36">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="36" rx="6" fill="#0d0d0d" stroke="#00ff88" stroke-width="1.5"/>
  
  <!-- Rocket icon -->
  <g transform="translate(10, 6)" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Rocket body -->
    <path d="M12 2C12 2 8 6 8 12C8 15 9 18 12 21C15 18 16 15 16 12C16 6 12 2 12 2Z" fill="#0d0d0d"/>
    <!-- Window -->
    <circle cx="12" cy="10" r="2" fill="#00ff88"/>
    <!-- Left fin -->
    <path d="M8 14L5 17L8 16"/>
    <!-- Right fin -->
    <path d="M16 14L19 17L16 16"/>
    <!-- Flame -->
    <path d="M10 21L12 25L14 21" stroke="#00ff88"/>
  </g>
  <!-- Text -->
  <text x="38" y="23" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#00ff88" filter="url(#glow)">
    DEPLOY ON QARNOT
  </text>
</svg>